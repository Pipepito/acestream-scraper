name: Phase 3 Cutover Validation

on:
  pull_request:
  push:
    branches:
      - main
      - release/**
  workflow_dispatch:

jobs:
  cutover-quick:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare parity venv for phase1 gate runner
        run: |
          python3 -m venv backend/venv
          backend/venv/bin/pip install --upgrade pip
          backend/venv/bin/pip install -r backend/requirements.txt

      - name: Run phase3 quick profile
        run: |
          python3 scripts/phase_gates/phase3_gate_runner.py --profile quick --json-output > phase3-gate-report-quick.json

      - name: Upload quick report
        uses: actions/upload-artifact@v4
        with:
          name: phase3-gate-report-quick
          path: phase3-gate-report-quick.json

  cutover-full:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare parity venv for phase1 gate runner
        run: |
          python3 -m venv backend/venv
          backend/venv/bin/pip install --upgrade pip
          backend/venv/bin/pip install -r backend/requirements.txt

      - name: Run phase3 full profile
        run: |
          python3 scripts/phase_gates/phase3_gate_runner.py --profile full --json-output > phase3-gate-report-full.json

      - name: Collect cutover evidence
        run: |
          bash scripts/ci/collect_cutover_evidence.sh --report phase3-gate-report-full.json

      - name: Upload full report and evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase3-cutover-evidence
          path: |
            phase3-gate-report-full.json
            docs/release/phase3-cutover-evidence.md
