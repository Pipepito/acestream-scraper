name: Multi-Arch Validation

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - release/**
  workflow_dispatch:

jobs:
  changed-files:
    name: Detect Multi-Arch Surface Changes
    runs-on: ubuntu-latest
    outputs:
      multiarch-touched: ${{ steps.filter.outputs.multiarch-touched }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Filter touched paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            multiarch-touched:
              - 'Dockerfile'
              - 'docker/**'
              - 'scripts/ci/build_multiarch_images.sh'
              - 'scripts/ci/verify_multiarch_manifest.sh'
              - 'scripts/ci/phase5_arch_smoke.sh'
              - 'scripts/ci/flavor_platforms.py'
              - 'scripts/phase_gates/phase5_*'
              - 'entrypoint.sh'
              - 'healthcheck.sh'
              - 'warp-setup.sh'

  multiarch-quick:
    name: Multi-Arch Quick Profile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate scraper flavor build matrix (dry-run)
        run: |
          bash scripts/ci/build_multiarch_images.sh \
            --dry-run \
            --flavor scraper \
            --result-file phase5-build-result-quick-scraper.json

      - name: Verify scraper flavor platform matrix
        run: |
          bash scripts/ci/verify_multiarch_manifest.sh \
            --result-file phase5-build-result-quick-scraper.json \
            --flavor scraper

      - name: Validate scraper-acestream flavor build matrix (dry-run)
        run: |
          bash scripts/ci/build_multiarch_images.sh \
            --dry-run \
            --flavor scraper-acestream \
            --result-file phase5-build-result-quick-scraper-acestream.json

      - name: Verify scraper-acestream flavor platform matrix
        run: |
          bash scripts/ci/verify_multiarch_manifest.sh \
            --result-file phase5-build-result-quick-scraper-acestream.json \
            --flavor scraper-acestream

      - name: Validate scraper-acexy flavor build matrix (dry-run)
        run: |
          bash scripts/ci/build_multiarch_images.sh \
            --dry-run \
            --flavor scraper-acexy \
            --result-file phase5-build-result-quick-scraper-acexy.json

      - name: Verify scraper-acexy flavor platform matrix
        run: |
          bash scripts/ci/verify_multiarch_manifest.sh \
            --result-file phase5-build-result-quick-scraper-acexy.json \
            --flavor scraper-acexy

      - name: Validate scraper-acestream-acexy flavor build matrix (dry-run)
        run: |
          bash scripts/ci/build_multiarch_images.sh \
            --dry-run \
            --flavor scraper-acestream-acexy \
            --result-file phase5-build-result-quick-scraper-acestream-acexy.json

      - name: Verify scraper-acestream-acexy flavor platform matrix
        run: |
          bash scripts/ci/verify_multiarch_manifest.sh \
            --result-file phase5-build-result-quick-scraper-acestream-acexy.json \
            --flavor scraper-acestream-acexy

      - name: Run phase-5 quick gate profile
        run: |
          python3 scripts/phase_gates/phase5_gate_runner.py --profile quick --json-output > phase5-gate-report-quick.json

      - name: Print gate report on failure
        if: failure()
        run: cat phase5-gate-report-quick.json || true

      - name: Upload quick profile artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase5-multiarch-quick
          path: |
            phase5-build-result-quick-scraper.json
            phase5-build-result-quick-scraper-acestream.json
            phase5-build-result-quick-scraper-acexy.json
            phase5-build-result-quick-scraper-acestream-acexy.json
            phase5-gate-report-quick.json

  multiarch-full:
    name: Multi-Arch Full Profile
    needs: changed-files
    # Always run on push to main/release. On PRs, only run when
    # Dockerfile/docker/multiarch scripts/entrypoint changed, OR when the PR
    # carries the `full-multiarch-test` label, so risky cross-arch changes
    # get real runtime smoke before merge without spending ~40min per
    # everyday PR.
    if: |
      github.event_name != 'pull_request' ||
      needs.changed-files.outputs.multiarch-touched == 'true' ||
      contains(github.event.pull_request.labels.*.name, 'full-multiarch-test')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run phase-5 full gate profile
        run: |
          python3 scripts/phase_gates/phase5_gate_runner.py --profile full --json-output > phase5-gate-report-full.json

      - name: Print gate report on failure
        if: failure()
        run: cat phase5-gate-report-full.json || true

      - name: Upload full profile artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase5-multiarch-full
          path: |
            phase5-build-result-full-scraper.json
            phase5-build-result-full-scraper-acestream.json
            phase5-build-result-full-scraper-acexy.json
            phase5-build-result-full-scraper-acestream-acexy.json
            phase5-gate-report-full.json
