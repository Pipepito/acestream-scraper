name: Pull Request Checks

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

jobs:
  required-checks:
    name: Required Cutover Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Run canonical v2 test suite (quick)
        run: |
          bash scripts/ci/run_v2_test_suite.sh --profile quick

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate multi-arch build matrix (dry-run)
        run: |
          bash scripts/ci/build_multiarch_images.sh \
            --dry-run \
            --platforms linux/arm/v7,linux/arm64 \
            --result-file phase5-build-result-pr.json

      - name: Verify required architecture matrix entries
        run: |
          bash scripts/ci/verify_multiarch_manifest.sh \
            --result-file phase5-build-result-pr.json \
            --required linux/arm/v7,linux/arm64

      - name: Enforce legacy path guardrails
        run: |
          bash scripts/ci/assert_no_legacy_paths.sh --strict

      - name: Run cutover required checks (quick profile)
        run: |
          bash scripts/ci/run_cutover_required_checks.sh --profile quick
