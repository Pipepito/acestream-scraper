name: Pull Request Checks

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

jobs:
  required-checks:
    name: Required Cutover Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Run cutover test suite (quick)
        run: |
          bash scripts/ci/run_v2_test_suite.sh --profile quick

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate scraper flavor build matrix (dry-run)
        run: |
          bash scripts/ci/build_multiarch_images.sh \
            --dry-run \
            --flavor scraper \
            --result-file phase5-build-result-pr-scraper.json

      - name: Verify scraper flavor platform matrix
        run: |
          bash scripts/ci/verify_multiarch_manifest.sh \
            --result-file phase5-build-result-pr-scraper.json \
            --flavor scraper

      - name: Validate scraper-acestream flavor build matrix (dry-run)
        run: |
          bash scripts/ci/build_multiarch_images.sh \
            --dry-run \
            --flavor scraper-acestream \
            --result-file phase5-build-result-pr-scraper-acestream.json

      - name: Verify scraper-acestream flavor platform matrix
        run: |
          bash scripts/ci/verify_multiarch_manifest.sh \
            --result-file phase5-build-result-pr-scraper-acestream.json \
            --flavor scraper-acestream

      - name: Validate scraper-acexy flavor build matrix (dry-run)
        run: |
          bash scripts/ci/build_multiarch_images.sh \
            --dry-run \
            --flavor scraper-acexy \
            --result-file phase5-build-result-pr-scraper-acexy.json

      - name: Verify scraper-acexy flavor platform matrix
        run: |
          bash scripts/ci/verify_multiarch_manifest.sh \
            --result-file phase5-build-result-pr-scraper-acexy.json \
            --flavor scraper-acexy

      - name: Validate scraper-acestream-acexy flavor build matrix (dry-run)
        run: |
          bash scripts/ci/build_multiarch_images.sh \
            --dry-run \
            --flavor scraper-acestream-acexy \
            --result-file phase5-build-result-pr-scraper-acestream-acexy.json

      - name: Verify scraper-acestream-acexy flavor platform matrix
        run: |
          bash scripts/ci/verify_multiarch_manifest.sh \
            --result-file phase5-build-result-pr-scraper-acestream-acexy.json \
            --flavor scraper-acestream-acexy

      - name: Enforce legacy path guardrails
        run: |
          bash scripts/ci/assert_no_legacy_paths.sh --strict

      - name: Run cutover required checks (quick profile)
        run: |
          bash scripts/ci/run_cutover_required_checks.sh --profile quick
