name: Release Pipeline

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "scripts/**"
      - "docs/**"
      - ".github/workflows/**"
      - "Dockerfile"
      - "docker-compose.yml"
      - "version.txt"
  workflow_dispatch:

jobs:
  required-checks:
    name: Required Release Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare backend virtualenv
        run: |
          python -m venv backend/venv
          backend/venv/bin/python -m pip install --upgrade pip
          backend/venv/bin/pip install -r backend/requirements.txt

      - name: Run backend tests
        run: |
          backend/venv/bin/pytest -q backend/tests

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Run frontend build
        run: |
          cd frontend
          npm run build

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate scraper flavor build matrix (dry-run)
        run: |
          bash scripts/ci/build_multiarch_images.sh \
            --dry-run \
            --flavor scraper \
            --result-file phase5-build-result-release-scraper.json

      - name: Verify scraper flavor platform matrix
        run: |
          bash scripts/ci/verify_multiarch_manifest.sh \
            --result-file phase5-build-result-release-scraper.json \
            --flavor scraper

      - name: Validate scraper-acestream flavor build matrix (dry-run)
        run: |
          bash scripts/ci/build_multiarch_images.sh \
            --dry-run \
            --flavor scraper-acestream \
            --result-file phase5-build-result-release-scraper-acestream.json

      - name: Verify scraper-acestream flavor platform matrix
        run: |
          bash scripts/ci/verify_multiarch_manifest.sh \
            --result-file phase5-build-result-release-scraper-acestream.json \
            --flavor scraper-acestream

      - name: Validate scraper-acexy flavor build matrix (dry-run)
        run: |
          bash scripts/ci/build_multiarch_images.sh \
            --dry-run \
            --flavor scraper-acexy \
            --result-file phase5-build-result-release-scraper-acexy.json

      - name: Verify scraper-acexy flavor platform matrix
        run: |
          bash scripts/ci/verify_multiarch_manifest.sh \
            --result-file phase5-build-result-release-scraper-acexy.json \
            --flavor scraper-acexy

      - name: Validate full flavor build matrix (dry-run)
        run: |
          bash scripts/ci/build_multiarch_images.sh \
            --dry-run \
            --flavor scraper-acestream-acexy \
            --result-file phase5-build-result-release-scraper-acestream-acexy.json

      - name: Verify full flavor platform matrix
        run: |
          bash scripts/ci/verify_multiarch_manifest.sh \
            --result-file phase5-build-result-release-scraper-acestream-acexy.json \
            --flavor scraper-acestream-acexy

      - name: Enforce legacy path guardrails
        run: |
          bash scripts/ci/assert_no_legacy_paths.sh --strict

      - name: Run cutover required checks (full profile)
        run: |
          bash scripts/ci/run_cutover_required_checks.sh --profile full

  build-image:
    name: Build Release Images
    runs-on: ubuntu-latest
    needs: required-checks
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read release version
        run: |
          echo "VERSION=$(tr -d '\n' < version.txt)" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build full flavor release tags
        run: |
          bash scripts/ci/build_multiarch_images.sh \
            --flavor scraper-acestream-acexy \
            --push \
            --tag pipepito/acestream-scraper:latest \
            --tag pipepito/acestream-scraper:${VERSION} \
            --tag pipepito/acestream-scraper:scraper-acestream-acexy \
            --tag pipepito/acestream-scraper:${VERSION}-scraper-acestream-acexy \
            --result-file phase5-build-result-release-full-publish.json

      - name: Verify full flavor release tags
        run: |
          bash scripts/ci/verify_multiarch_manifest.sh \
            --result-file phase5-build-result-release-full-publish.json \
            --flavor scraper-acestream-acexy

      - name: Build scraper flavor release tags
        run: |
          bash scripts/ci/build_multiarch_images.sh \
            --flavor scraper \
            --push \
            --tag pipepito/acestream-scraper:scraper \
            --tag pipepito/acestream-scraper:${VERSION}-scraper \
            --result-file phase5-build-result-release-scraper-publish.json

      - name: Verify scraper flavor release tags
        run: |
          bash scripts/ci/verify_multiarch_manifest.sh \
            --result-file phase5-build-result-release-scraper-publish.json \
            --flavor scraper

      - name: Build scraper-acestream flavor release tags
        run: |
          bash scripts/ci/build_multiarch_images.sh \
            --flavor scraper-acestream \
            --push \
            --tag pipepito/acestream-scraper:scraper-acestream \
            --tag pipepito/acestream-scraper:${VERSION}-scraper-acestream \
            --result-file phase5-build-result-release-scraper-acestream-publish.json

      - name: Verify scraper-acestream flavor release tags
        run: |
          bash scripts/ci/verify_multiarch_manifest.sh \
            --result-file phase5-build-result-release-scraper-acestream-publish.json \
            --flavor scraper-acestream

      - name: Build scraper-acexy flavor release tags
        run: |
          bash scripts/ci/build_multiarch_images.sh \
            --flavor scraper-acexy \
            --push \
            --tag pipepito/acestream-scraper:scraper-acexy \
            --tag pipepito/acestream-scraper:${VERSION}-scraper-acexy \
            --result-file phase5-build-result-release-scraper-acexy-publish.json

      - name: Verify scraper-acexy flavor release tags
        run: |
          bash scripts/ci/verify_multiarch_manifest.sh \
            --result-file phase5-build-result-release-scraper-acexy-publish.json \
            --flavor scraper-acexy
