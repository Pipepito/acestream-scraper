name: Release Pipeline

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "scripts/**"
      - "docs/**"
      - ".github/workflows/**"
      - "Dockerfile"
      - "docker-compose.yml"
      - "version.txt"
  workflow_dispatch:

jobs:
  required-checks:
    name: Required Release Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare backend virtualenv
        run: |
          python -m venv backend/venv
          backend/venv/bin/python -m pip install --upgrade pip
          backend/venv/bin/pip install -r backend/requirements.txt

      - name: Run backend tests
        run: |
          backend/venv/bin/pytest -q backend/tests

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Run frontend build
        run: |
          cd frontend
          npm run build

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate multi-arch build matrix (dry-run)
        run: |
          bash scripts/ci/build_multiarch_images.sh \
            --dry-run \
            --platforms linux/arm/v7,linux/arm64 \
            --result-file phase5-build-result-release-checks.json

      - name: Verify required architecture matrix entries
        run: |
          bash scripts/ci/verify_multiarch_manifest.sh \
            --result-file phase5-build-result-release-checks.json \
            --required linux/arm/v7,linux/arm64

      - name: Enforce legacy path guardrails
        run: |
          bash scripts/ci/assert_no_legacy_paths.sh --strict

      - name: Run cutover required checks (full profile)
        run: |
          bash scripts/ci/run_cutover_required_checks.sh --profile full

  build-image:
    name: Build Release Image
    runs-on: ubuntu-latest
    needs: required-checks
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build canonical multi-arch release image
        run: |
          bash scripts/ci/build_multiarch_images.sh \
            --platforms linux/amd64,linux/arm/v7,linux/arm64 \
            --tag pipepito/acestream-scraper-v2:${{ github.sha }} \
            --result-file phase5-build-result-release-image.json

      - name: Verify release image architecture matrix
        run: |
          bash scripts/ci/verify_multiarch_manifest.sh \
            --result-file phase5-build-result-release-image.json \
            --required linux/arm/v7,linux/arm64
