name: Release Pipeline

# Validation-only mirror of the Jenkins acestream-scraper-release pipeline.
# Jenkins is the canonical publisher (see docs/ops/jenkins-ci.md and
# jenkins/release.Jenkinsfile); this workflow runs the same multi-arch
# preflight + AceStream engine runtime smoke without pushing tags to Docker
# Hub. Triggered manually from the Actions tab when a parity check is wanted
# without driving the Jenkins controller.

on:
  workflow_dispatch:

jobs:
  required-checks:
    name: Release Readiness (Validation Only)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare backend virtualenv
        run: |
          python -m venv backend/venv
          backend/venv/bin/python -m pip install --upgrade pip
          backend/venv/bin/pip install -r backend/requirements.txt

      - name: Run backend tests
        run: |
          backend/venv/bin/pytest -q backend/tests

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Run frontend build
        run: |
          cd frontend
          npm run build

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate scraper flavor build matrix (dry-run)
        run: |
          bash scripts/ci/build_multiarch_images.sh \
            --dry-run \
            --flavor scraper \
            --result-file phase5-build-result-release-scraper.json

      - name: Verify scraper flavor platform matrix
        run: |
          bash scripts/ci/verify_multiarch_manifest.sh \
            --result-file phase5-build-result-release-scraper.json \
            --flavor scraper

      - name: Validate scraper-acestream flavor build matrix (dry-run)
        run: |
          bash scripts/ci/build_multiarch_images.sh \
            --dry-run \
            --flavor scraper-acestream \
            --result-file phase5-build-result-release-scraper-acestream.json

      - name: Verify scraper-acestream flavor platform matrix
        run: |
          bash scripts/ci/verify_multiarch_manifest.sh \
            --result-file phase5-build-result-release-scraper-acestream.json \
            --flavor scraper-acestream

      - name: Validate scraper-acexy flavor build matrix (dry-run)
        run: |
          bash scripts/ci/build_multiarch_images.sh \
            --dry-run \
            --flavor scraper-acexy \
            --result-file phase5-build-result-release-scraper-acexy.json

      - name: Verify scraper-acexy flavor platform matrix
        run: |
          bash scripts/ci/verify_multiarch_manifest.sh \
            --result-file phase5-build-result-release-scraper-acexy.json \
            --flavor scraper-acexy

      - name: Validate full flavor build matrix (dry-run)
        run: |
          bash scripts/ci/build_multiarch_images.sh \
            --dry-run \
            --flavor scraper-acestream-acexy \
            --result-file phase5-build-result-release-scraper-acestream-acexy.json

      - name: Verify full flavor platform matrix
        run: |
          bash scripts/ci/verify_multiarch_manifest.sh \
            --result-file phase5-build-result-release-scraper-acestream-acexy.json \
            --flavor scraper-acestream-acexy

      - name: Enforce legacy path guardrails
        run: |
          bash scripts/ci/assert_no_legacy_paths.sh --strict

      - name: Run cutover required checks (full profile)
        run: |
          bash scripts/ci/run_cutover_required_checks.sh --profile full

      - name: Build scraper-acestream image with manifest-derived args
        run: |
          bash scripts/ci/build_multiarch_images.sh \
            --flavor scraper-acestream \
            --load \
            --tag acestream-scraper:release-smoke

      - name: Run AceStream engine runtime smoke
        env:
          PYTHONPATH: backend
        run: backend/venv/bin/pytest -q backend/tests/docker/test_acestream_runtime_smoke.py -v

  multiarch-runtime-smoke:
    name: Multi-Arch Runtime Smoke (Full Profile)
    runs-on: ubuntu-latest
    needs: required-checks
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run phase-5 full gate profile
        run: |
          python3 scripts/phase_gates/phase5_gate_runner.py \
            --profile full \
            --json-output > phase5-gate-report-full.json

      - name: Upload runtime smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase5-multiarch-full-evidence
          path: |
            phase5-gate-report-full.json
            phase5-build-result-full-*.json
