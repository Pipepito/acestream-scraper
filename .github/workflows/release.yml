name: Release Pipeline

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "scripts/**"
      - "docs/**"
      - ".github/workflows/**"
      - "Dockerfile"
      - "docker-compose.yml"
      - "version.txt"
  workflow_dispatch:

jobs:
  required-checks:
    name: Required Release Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare backend virtualenv
        run: |
          python -m venv backend/venv
          backend/venv/bin/python -m pip install --upgrade pip
          backend/venv/bin/pip install -r backend/requirements.txt

      - name: Run backend tests
        run: |
          backend/venv/bin/pytest -q backend/tests

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Run frontend tests
        env:
          CI: "true"
        run: |
          cd frontend
          npm test -- --watch=false

      - name: Run frontend build
        run: |
          cd frontend
          npm run build

      - name: Enforce legacy path guardrails
        run: |
          bash scripts/ci/assert_no_legacy_paths.sh --strict

      - name: Run cutover required checks (full profile)
        run: |
          bash scripts/ci/run_cutover_required_checks.sh --profile full

  build-image:
    name: Build Release Image
    runs-on: ubuntu-latest
    needs: required-checks
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build canonical release image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: |
            pipepito/acestream-scraper-v2:latest
            pipepito/acestream-scraper-v2:${{ github.sha }}
