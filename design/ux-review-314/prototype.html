const paths={tv:'<rect x="3" y="5" width="18" height="13" rx="2"/><path d="M8 21h8M9 2l3 3 3-3"/>',home:'<path d="M3 10l9-7 9 7v10H3zM9 20v-7h6v7"/>',record:'<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/>',calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4m10-4v4M3 10h18M8 14h2m4 0h2"/>',grid:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',source:'<path d="M4 7h16v13H4zM4 7l3-4h5l2 4M8 12h8m-8 4h5"/>',guide:'<path d="M3 4h7a2 2 0 012 2v15a3 3 0 00-3-2H3zM21 4h-7a2 2 0 00-2 2v15a3 3 0 013-2h6z"/>',playlist:'<path d="M4 5h12M4 10h12M4 15h7m3-1v7l6-3.5z"/>',connection:'<path d="M8 12l4-4m-8 6l-1 1a4 4 0 006 6l5-5a4 4 0 000-6m-4 4a4 4 0 010-6l5-5a4 4 0 016 6l-1 1"/>',pulse:'<path d="M2 12h5l3-8 4 16 3-8h5"/>',settings:'<path d="M4 6h16M4 12h16M4 18h16"/><circle cx="8" cy="6" r="2" fill="var(--surface)"/><circle cx="16" cy="12" r="2" fill="var(--surface)"/><circle cx="10" cy="18" r="2" fill="var(--surface)"/>',shield:'<path d="M12 2l8 4v6c0 5-8 10-8 10S4 17 4 12V6zM9 12l2 2 4-5"/>',chevron:'<path d="M9 5l7 7-7 7"/>',down:'<path d="M5 9l7 7 7-7"/>',globe:'<circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12h18"/>',sun:'<circle cx="12" cy="12" r="4"/><path d="M12 1v2m0 18v2M1 12h2m18 0h2M4 4l2 2m12 12l2 2M4 20l2-2M18 6l2-2"/>',moon:'<path d="M20 15A9 9 0 019 3a9 9 0 1011 12z"/>',search:'<circle cx="10" cy="10" r="6"/><path d="M15 15l6 6"/>',pause:'<path d="M8 5v14m8-14v14"/>',play:'<path d="M6 3l15 9-15 9z"/>',volume:'<path d="M3 9h4l5-5v16l-5-5H3zM16 8a6 6 0 010 8m3-11a10 10 0 010 14"/>',expand:'<path d="M3 9V3h6m6 0h6v6m0 6v6h-6M9 21H3v-6"/>',cast:'<path d="M8 4h13v15h-7M3 12a9 9 0 019 9M3 16a5 5 0 015 5"/><circle cx="3" cy="21" r="1"/>',stop:'<rect x="5" y="5" width="14" height="14" rx="1"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 6v6l4 2"/>',check:'<path d="M4 12l5 5L20 6"/>',info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v6m0-10v1"/>',menu:'<path d="M4 6h16M4 12h16M4 18h16"/>',more:'<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',plus:'<path d="M12 4v16M4 12h16"/>',reorder:'<path d="M4 6h16M4 12h16M4 18h16m-16-9l-2 3 2 3m16-6l2 3-2 3"/>'};
function icon(n){return '<svg class="icon" viewBox="0 0 24 24" aria-hidden="true">'+(paths[n]||paths.tv)+'</svg>'}const t=(en,es)=>lang==='es'?es:en;const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const channels=[{name:'Northlight',short:'N',tone:'',category:['Nature','Naturaleza'],programme:['Coastlines: the Atlantic','Costas: el Atlántico'],next:['The quiet forest','El bosque tranquilo'],fav:true,guide:true,status:'online'},{name:'World 24',short:'W24',tone:'blue',category:['News','Noticias'],programme:['The world today','El mundo hoy'],next:['The evening interview','La entrevista de la tarde'],fav:true,guide:true,status:'online'},{name:'Atelier',short:'a.',tone:'ochre',category:['Culture','Cultura'],programme:['Inside the studio','Dentro del estudio'],next:['A city in colour','Una ciudad a todo color'],fav:false,guide:true,status:'online'},{name:'Juniper',short:'J',tone:'rose',category:['Entertainment','Entretenimiento'],programme:['A table for everyone','Una mesa para todos'],next:['The weekend edit','Planes de fin de semana'],fav:false,guide:false,status:'unknown'},{name:'Kite',short:'k',tone:'violet',category:['Kids','Infantil'],programme:['Small discoveries','Pequeños descubrimientos'],next:['The garden club','El club del jardín'],fav:true,guide:true,status:'online'},{name:'Field',short:'F',tone:'',category:['Sport','Deportes'],programme:['Weekend highlights','Lo mejor de la semana'],next:['The next challenge','El próximo reto'],fav:false,guide:true,status:'unknown'}];
function data(a){return a[lang==='es'?1:0]}function link(label,es,i,v,active){return '<a href="?view='+v+'&lang='+lang+'&theme='+theme+'" class="navitem '+(active?'active':'')+'" onclick="navigate(\''+v+'\');return false">'+icon(i)+t(label,es)+'</a>'}
function sidebar(){return '<aside class="sidebar"><div class="brand">'+icon('tv')+'<span>AceStream Scraper</span></div><nav><div class="navgroup"><div class="navlabel">'+t('Watch','Ver TV')+'</div>'+link('Home','Inicio','home','live',false)+link('Live TV','TV en directo','tv','live',view==='live')+link('Recordings','Grabaciones','record','live',false)+link('Events','Eventos','calendar','live',false)+'</div><div class="navgroup"><div class="navlabel">'+t('Manage','Gestionar')+'</div>'+link('TV channels','Canales de TV','grid','channels',view==='channels')+link('Channel sources','Fuentes de canales','source','channels',false)+link('Programme guide','Guía de programación','guide','channels',false)+link('Playlists','Listas de reproducción','playlist','channels',false)+'</div><div class="navgroup"><div class="navlabel">'+t('Connections','Conexiones')+'</div>'+link('Players & TVs','Reproductores y TV','connection','settings',false)+'</div><div class="navgroup"><div class="navlabel">'+t('System','Sistema')+'</div>'+link('System status','Estado del sistema','pulse','settings',false)+link('WARP','WARP','shield','settings',false)+link('Settings','Ajustes','settings','settings',view==='settings')+'</div></nav><div class="sidebarfoot"><button class="flat" onclick="setLang()">'+icon('globe')+'<span>'+t('English','Español')+'</span></button><button class="flat" onclick="setTheme()" aria-label="'+t('Change theme','Cambiar tema')+'">'+icon(theme==='dark'?'sun':'moon')+'</button></div></aside>'}
function scene(){return '<svg class="scene" viewBox="0 0 900 506" preserveAspectRatio="xMidYMid slice" role="img" aria-label="'+t('Illustrated landscape used as sample programme artwork','Paisaje ilustrado de muestra para el programa')+'"><rect width="900" height="506" fill="#617f79"/><rect y="250" width="900" height="256" fill="#294e50"/><circle cx="735" cy="112" r="44" fill="#dfdec0"/><path d="M0 155L80 163 142 183 225 173 270 197 322 218 350 260 414 270 440 312 487 323 539 369 630 387 646 429 717 457 900 506H0Z" fill="#263e34"/><path d="M0 207L86 206 151 224 237 220 281 244 334 267 354 291 414 311 424 335 475 355 511 390 577 409 622 435 694 461 773 506H0Z" fill="#3e5945"/><path d="M305 218l45 43 66 14 23 39 50 13 50 44 93 18 12 42 80 29 127 46" fill="none" stroke="#bbc3aa" stroke-width="5" opacity=".7"/><path d="M530 285l54-6m-22 42l110-8m-6-38l133-9M706 368l155-10m-67-130l55-2" stroke="#a7b8ae" stroke-width="2" opacity=".45"/><path d="M0 0h460v506H0Z" fill="#09160e" opacity=".33"/></svg>'}
function live(){const c=channels[selected];return '<header class="pagehead"><div><h1>'+t('Live TV','TV en directo')+'</h1><p>'+t('Your channels. Ready to watch.','Tus canales, listos para ver.')+'</p></div><button class="flat manage" onclick="navigate(\'channels\')">'+t('Manage channels','Gestionar canales')+icon('chevron')+'</button></header><div class="livegrid"><section class="viewing"><div class="player">'+scene()+'<div class="player-overlay"><span class="onair"><i></i>'+t('LIVE','EN DIRECTO')+'</span><span>'+c.name.toUpperCase()+'</span></div><div class="scene-caption"><span class="kicker">'+'A DIFFERENT VIEW'+'</span><strong>'+'The Atlantic<br>coast'+'</strong><small>'+'A journey along the water’s edge'+'</small></div><div class="playercontrols"><div class="controlgroup"><button onclick="playing=!playing;render()" aria-label="'+t('Pause preview','Pausar vista previa')+'">'+icon(playing?'pause':'play')+'</button><button onclick="demo()" aria-label="'+t('Volume','Volumen')+'">'+icon('volume')+'</button><span>'+t('Live','Directo')+'</span></div><div class="controlgroup"><span class="quality">HD</span><button onclick="demo()" aria-label="'+t('Player settings','Ajustes del reproductor')+'">'+icon('settings')+'</button><button onclick="demo()" aria-label="'+t('Full screen','Pantalla completa')+'">'+icon('expand')+'</button></div></div></div><div class="playingtitle"><div><h2>'+c.programme[0]+'</h2><p>18:00 – 19:00 · '+data(c.category)+'</p><div class="channel-line">'+c.name+' <span class="tag">HD</span><span>· '+t('English audio','Audio en inglés')+'</span></div></div><button class="flat" onclick="favorite('+selected+')" aria-label="'+t('Toggle favourite','Cambiar favorito')+'">'+(c.fav?'★':'☆')+'</button></div><div class="watchactions"><button class="button" onclick="demo()">'+icon('record')+t('Record','Grabar')+'</button><button class="button secondary-device" onclick="demo()">'+icon('cast')+t('Send to TV','Enviar a TV')+'</button><button class="flat" onclick="playing=!playing;render()">'+icon(playing?'stop':'play')+t(playing?'Stop watching':'Watch again',playing?'Dejar de ver':'Volver a ver')+'</button></div><section class="upnext"><div class="sectiontop"><h3>'+t('Coming up on ','A continuación en ')+c.name+'</h3><span class="count">'+t('Today','Hoy')+'</span></div><div class="programme"><time>19:00</time><div>'+c.next[0]+'<p>'+t('Nature · 60 min','Naturaleza · 60 min')+'</p></div><button class="flat" onclick="demo()" aria-label="'+t('Schedule recording','Programar grabación')+'">'+icon('record')+'</button></div><div class="programme"><time>20:00</time><div>'+'Under the night sky'+'<p>'+t('Documentary · 45 min','Documental · 45 min')+'</p></div><button class="flat" onclick="demo()" aria-label="'+t('Schedule recording','Programar grabación')+'">'+icon('record')+'</button></div></section><div class="helpnote">'+icon('info')+t('Changing a filter won’t stop what you’re watching.','Cambiar los filtros no interrumpe lo que estás viendo.')+'</div></section><section class="catalogue"><div class="cataloguehead"><div class="sectiontop"><h3>'+t('Channels','Canales')+'</h3><span class="count">'+t('6 available','6 disponibles')+'</span></div><label class="search">'+icon('search')+'<input aria-label="'+t('Find a channel','Buscar un canal')+'" placeholder="'+t('Find a channel','Buscar un canal')+'" value="'+esc(filter)+'" oninput="filter=this.value;updateRows()"></label><div class="filters"><button class="filter '+(!favoritesOnly?'selected':'')+'" onclick="favoritesOnly=false;render()">'+t('All channels','Todos')+'</button><button class="filter '+(favoritesOnly?'selected':'')+'" onclick="favoritesOnly=true;render()">☆ '+t('Favourites','Favoritos')+'</button></div></div><div id="channelrows">'+channelRows()+'</div><div class="cataloguefoot">'+t('Programme times shown in Europe/Madrid.','Horarios de la guía en Europe/Madrid.')+'</div></section></div>'}
function channelRows(){return channels.map((c,i)=>({c,i})).filter(({c})=>(!favoritesOnly||c.fav)&&c.name.toLowerCase().includes(filter.toLowerCase())).map(({c,i})=>'<div class="channelrow '+(i===selected?'selected':'')+'" role="button" tabindex="0" onclick="selected='+i+';playing=true;render()" onkeydown="if(event.key===\'Enter\'){selected='+i+';render()}"><span class="channelmark '+c.tone+'">'+c.short+'</span><div class="grow"><h4>'+(i+1)+'. '+c.name+'</h4><p>'+c.programme[0]+'</p></div>'+(i===selected?'<span class="playingbars">▥</span>':'<span class="favorite">'+(c.fav?'★':'')+'</span>')+'</div>').join('')||'<div class="catalogueempty">'+t('No channels match your search.','No hay canales que coincidan.')+'</div>'}function updateRows(){document.getElementById('channelrows').innerHTML=channelRows()}
function settings(){const sections=[['Playback','Reproducción','How you watch','Cómo ves la TV'],['Recordings','Grabaciones','Storage and recording defaults','Almacenamiento y opciones'],['Background updates','Actualizaciones','Sources, guide and checks','Fuentes, guía y comprobaciones'],['Stream links','Enlaces de emisión','Link formats for other players','Formatos para otros reproductores'],['Accounts & access','Cuentas y acceso','Who can use this installation','Quién puede usar la aplicación'],['Network','Red','Advanced connection settings','Opciones avanzadas de conexión']];return '<header class="pagehead"><div><h1>'+t('Settings','Ajustes')+'</h1><p>'+t('Make the app work for you.','Configura la aplicación a tu medida.')+'</p></div><button class="flat manage" onclick="demo()">'+icon('info')+t('Help','Ayuda')+'</button></header><div class="settingsgrid"><nav class="settingsnav">'+sections.map((x,i)=>'<a href="#" class="settinglink '+(i===2?'active':'')+'" onclick="'+(i===2?'':'demo();')+'return false">'+t(x[0],x[1])+'<span>'+t(x[2],x[3])+'</span></a>').join('')+'<div class="divide"></div><a class="settinglink" href="#" onclick="demo();return false">'+t('Players & connections','Reproductores y conexiones')+' ↗<span>'+t('TVs, apps and player address','TV, aplicaciones y dirección')+'</span></a><a class="settinglink" href="#" onclick="demo();return false">'+t('Notifications','Notificaciones')+' ↗<span>'+t('Choose what to hear about','Elige qué avisos recibir')+'</span></a></nav><div class="settingscontent"><label class="mobile-section"><select aria-label="'+t('Settings section','Sección de ajustes')+'">'+sections.map((x,i)=>'<option '+(i===2?'selected':'')+'>'+t(x[0],x[1])+'</option>').join('')+'</select></label><h2>'+t('Background updates','Actualizaciones')+'</h2><p class="intro">'+t('Keep your channels and programme guide up to date automatically.','Mantén tus canales y la guía de programación al día automáticamente.')+'</p><section class="formsection"><h3>'+t('Channel sources','Fuentes de canales')+'</h3><p>'+t('Look for new channels and changes in your saved sources.','Busca nuevos canales y cambios en tus fuentes guardadas.')+'</p><div class="fieldrow"><div><label for="frequency">'+t('Check for updates','Buscar actualizaciones')+'</label><div class="fieldhelp">'+t('Choose how often to look for changes.','Elige cada cuánto buscar cambios.')+'</div></div><div class="fieldcontrol"><select id="frequency" onchange="markDirty()"><option>'+t('Every 6 hours','Cada 6 horas')+'</option><option>'+t('Every 12 hours','Cada 12 horas')+'</option><option>'+t('Every day','Todos los días')+'</option></select></div></div><div class="fieldrow"><div><label for="starttime">'+t('Start at','Empezar a las')+'</label><div class="fieldhelp">'+t('Updates repeat from this time each day.','Las actualizaciones se repiten a partir de esta hora.')+'</div></div><div class="fieldcontrol"><input id="starttime" value="02:00" onchange="markDirty()"><div class="fieldcaption">'+t('Timezone','Zona horaria')+': Europe/Madrid</div></div></div><div class="scheduleline">'+icon('clock')+t('Next update: today at 20:00','Próxima actualización: hoy a las 20:00')+'</div></section><section class="formsection"><h3>'+t('Programme guide','Guía de programación')+'</h3><p>'+t('Refresh programme names and broadcast times.','Actualiza los títulos y los horarios de los programas.')+'</p><div class="fieldrow"><div><label for="guidefreq">'+t('Update the guide','Actualizar la guía')+'</label><div class="fieldhelp">'+t('Once a day is enough for most guides.','Una vez al día suele ser suficiente.')+'</div></div><div class="fieldcontrol"><select id="guidefreq" onchange="markDirty()"><option>'+t('Every day at 06:00','Cada día a las 06:00')+'</option><option>'+t('Every 12 hours','Cada 12 horas')+'</option></select></div></div></section><section class="formsection"><details><summary><span>'+t('Advanced: stream checks','Avanzado: comprobar emisiones')+'</span>'+icon('down')+'</summary><p>'+t('Choose when to verify that streams deliver audio or video. A dedicated checking engine is optional.','Elige cuándo comprobar que las emisiones tienen audio o vídeo. El motor de comprobación dedicado es opcional.')+'</p></details></section><div class="savebar"><p id="savestatus">'+t(dirty?'2 unsaved changes':'All changes saved',dirty?'2 cambios sin guardar':'Todos los cambios guardados')+'</p><div class="savebuttons"><button class="button" onclick="dirty=false;render()">'+t('Cancel','Cancelar')+'</button><button class="button primary" onclick="save()">'+t('Save changes','Guardar cambios')+'</button></div></div><p class="linkhelp">'+t('Changes apply to future updates. No restart needed.','Los cambios se aplican a las próximas actualizaciones. No hace falta reiniciar.')+'</p></div></div>'}
function inventory(){return '<header class="pagehead"><div><h1>'+t('TV channels','Canales de TV')+'</h1><p>'+t('Organise the channels people see in Live TV and playlists.','Organiza los canales de la TV en directo y las listas.')+'</p></div><div class="toolbar"><button class="button" onclick="demo()">'+icon('reorder')+t('Reorder','Reordenar')+'</button><button class="button primary" onclick="demo()">'+icon('plus')+t('Add channel','Añadir canal')+'</button></div></header><div class="filterbar"><label class="search">'+icon('search')+'<input placeholder="'+t('Search channels','Buscar canales')+'" aria-label="'+t('Search channels','Buscar canales')+'" oninput="filterTable(this.value)"></label><select aria-label="'+t('Category','Categoría')+'"><option>'+t('All categories','Todas las categorías')+'</option></select><select aria-label="'+t('Status','Estado')+'"><option>'+t('All statuses','Todos los estados')+'</option></select><label class="checkfilter"><input type="checkbox">'+t('Favourites','Favoritos')+'</label><div class="spacer"></div><button class="flat smalltext" onclick="demo()">'+icon('settings')+t('Advanced filters','Más filtros')+'</button></div><table class="inventory"><thead><tr><th><input type="checkbox" aria-label="'+t('Select all','Seleccionar todos')+'"></th><th>'+t('No.','N.º')+'</th><th>'+t('Channel','Canal')+'</th><th>'+t('Category','Categoría')+'</th><th>'+t('Programme guide','Guía de programación')+'</th><th>'+t('Signal','Señal')+'</th><th>'+t('Favourite','Favorito')+'</th><th></th></tr></thead><tbody>'+channels.map((c,i)=>'<tr data-channel="'+c.name.toLowerCase()+'"><td><input type="checkbox" aria-label="'+t('Select ','Seleccionar ')+c.name+'"></td><td><input class="number" aria-label="'+t('Channel number for ','Número de canal de ')+c.name+'" value="'+(i+1)+'"></td><td><div class="tablechannel"><span class="channelmark '+c.tone+'">'+c.short+'</span><span><strong>'+c.name+'</strong><small>'+(i===0?'3':i===1?'2':'1')+' '+t(i<2?'streams':'stream',i<2?'emisiones':'emisión')+'</small></span></div></td><td>'+data(c.category)+'</td><td>'+(c.guide?'<span>'+t('Linked','Vinculada')+'</span>':'<button class="flat smalltext" onclick="demo()">'+t('Set up guide','Vincular guía')+' ↗</button>')+'</td><td><span class="status '+(c.status==='unknown'?'neutral':'')+'">'+icon(c.status==='online'?'check':'clock')+t(c.status==='online'?'Verified':'Not checked',c.status==='online'?'Verificada':'Sin comprobar')+'</span></td><td><button class="favoritebtn '+(c.fav?'on':'')+'" onclick="favorite('+i+')" aria-label="'+t('Toggle favourite for ','Cambiar favorito de ')+c.name+'">'+(c.fav?'★':'☆')+'</button></td><td><button class="flat" onclick="demo()" aria-label="'+t('Channel actions','Acciones del canal')+'">'+icon('more')+'</button></td></tr>').join('')+'</tbody></table><div class="pagination"><span>'+t('1–6 of 6 channels','1–6 de 6 canales')+'</span><div class="right"><span class="rows">'+t('Rows per page: 25','Filas por página: 25')+'</span><button disabled aria-label="'+t('Previous page','Página anterior')+'">‹</button><span>1 / 1</span><button disabled aria-label="'+t('Next page','Página siguiente')+'">›</button></div></div><div class="helpnote">'+icon('info')+t('“Verified” means audio or video was detected at the last check. Availability can change.','«Verificada» indica que se detectó audio o vídeo en la última comprobación. La disponibilidad puede cambiar.')+'</div><div class="recordingshint"><div><h3>'+t('Ready to use these channels elsewhere?','¿Quieres usar estos canales en otro reproductor?')+'</h3><p>'+t('Your playlist keeps the channel numbers, favourites and guide links you set here.','La lista conserva los números, los favoritos y la guía que configuras aquí.')+'</p></div><button class="button" onclick="demo()">'+t('Open playlists','Abrir listas')+icon('chevron')+'</button></div>'}
function filterTable(value){document.querySelectorAll('[data-channel]').forEach(x=>x.style.display=x.dataset.channel.includes(value.toLowerCase())?'':'none')}
function render(){document.body.classList.toggle('dark',theme==='dark');document.body.classList.toggle('coral',palette==='coral');document.documentElement.lang=lang;document.getElementById('app').innerHTML='<div class="reviewbar"><b>'+t('PROPOSED DESIGN · SAMPLE DATA · NOT THE RUNNING APP','DISEÑO PROPUESTO · DATOS DE MUESTRA · NO ES LA APLICACIÓN REAL')+'</b><span><a href="?view=live&lang='+lang+'&theme=dark">Live TV</a> / <a href="?view=settings&lang='+lang+'&theme=light">Settings</a> / <a href="?view=channels&lang='+lang+'&theme=light">Channels</a> · Draft 01</span></div><div class="mobileheader"><button class="flat" onclick="demo()" aria-label="'+t('Menu','Menú')+'">'+icon('menu')+'</button><strong>AceStream Scraper</strong><button class="flat language" onclick="setLang()">'+t('EN','ES')+icon('globe')+'</button></div><div class="layout">'+sidebar()+'<main class="page">'+(view==='settings'?settings():view==='channels'?inventory():live())+'</main></div><nav class="bottomnav"><a href="#" class="'+(view==='live'?'active':'')+'" onclick="navigate(\'live\');return false">'+icon('tv')+t('Live TV','Directo')+'</a><a href="#" class="'+(view==='channels'?'active':'')+'" onclick="navigate(\'channels\');return false">'+icon('grid')+t('Channels','Canales')+'</a><a href="#" onclick="demo();return false">'+icon('record')+t('Recordings','Grabaciones')+'</a><a href="#" class="'+(view==='settings'?'active':'')+'" onclick="navigate(\'settings\');return false">'+icon('settings')+t('Settings','Ajustes')+'</a></nav>'}
function navigate(v){view=v;filter='';render();scrollTo(0,0)}function setLang(){lang=lang==='en'?'es':'en';render()}function setTheme(){theme=theme==='dark'?'light':'dark';render()}function favorite(i){channels[i].fav=!channels[i].fav;render()}function markDirty(){dirty=true;document.getElementById('savestatus').textContent=t('Unsaved changes','Cambios sin guardar')}function save(){dirty=false;render();toast(t('Saved in this preview only. No server settings were changed.','Guardado solo en esta vista previa. No se ha cambiado el servidor.'))}function demo(){toast(t('Design preview only — this action is not connected to a server.','Vista previa del diseño: esta acción no está conectada al servidor.'))}function toast(s){document.getElementById('notice').textContent=s;setTimeout(()=>document.getElementById('notice').textContent='',3200)}render();
</script></body></html>
