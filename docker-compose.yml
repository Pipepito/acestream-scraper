services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: pipepito/acestream-scraper:latest
    ports:
      - "8000:8000"
      # Publish these when running the embedded IPFS daemon (ENABLE_IPFS=true).
      # The gateway sits on 8081 in-container because Acexy owns 8080; the RPC
      # API (5001) is unauthenticated — keep it bound to the host's loopback.
      # - "4001:4001"            # IPFS swarm (TCP)
      # - "4001:4001/udp"        # IPFS swarm (QUIC)
      # - "8081:8081"            # IPFS HTTP gateway
      # - "127.0.0.1:5001:5001"  # IPFS RPC API / WebUI
    volumes:
      - ./config:/app/config
      - ./ipfs_data:/data/ipfs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DATABASE_URL=sqlite:///./config/scraper.db
      - LEGACY_DATABASE_URL=sqlite:///./config/acestream.db
      - ZERONET_URL=http://host.docker.internal:43110
      - FRONTEND_BUILD_PATH=frontend_build
      - ENABLE_WARP=false
      - ENABLE_ACESTREAM_ENGINE=false
      - ENABLE_ACEXY=false
      # Set ENABLE_IPFS=true to run the embedded Kubo daemon (amd64/arm64
      # images only). ipfs:// sources are fetched through IPFS_GATEWAY_URL,
      # which defaults to the embedded gateway (http://127.0.0.1:8081); point
      # it at an external node instead, e.g.
      # IPFS_GATEWAY_URL=http://host.docker.internal:8080, to scrape IPFS
      # without the embedded daemon.
      - ENABLE_IPFS=false
      - ACESTREAM_HTTP_HOST=localhost
      - ACESTREAM_HTTP_PORT=6878
      - ACEXY_HOST=localhost
      - ACEXY_PORT=6878
  zeronet:
    profiles:
      - zeronet
    image: nofish/zeronet:latest
    platform: linux/amd64
    ports:
      - "43110:43110"
    volumes:
      - ./zeronet_data:/root/data
    environment:
      - HOME=/root
      - USER_UID=1000
    extra_hosts:
      - "host.docker.internal:host-gateway"
