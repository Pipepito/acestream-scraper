row(t('Start with an empty catalogue','Empezar con un catálogo vacío'),t('Reconfigure channels, sources, catalogue settings and integrations.','Reconfigura canales, fuentes, ajustes del catálogo e integraciones.'),'',btn('Review start fresh','Revisar inicio desde cero',"openConfirm('fresh')",'danger'))),
'<h2>'+t('Keep access separate','Mantén el acceso separado')+'</h2><p>'+t('Catalogue recovery does not reset accounts or bypass sign-in. If access is denied, use the access recovery path.','Recuperar el catálogo no restablece cuentas ni evita iniciar sesión. Si se deniega el acceso, usa la recuperación de acceso.')+'</p><hr><h3>'+t('Current status','Estado actual')+'</h3>'+badge('Startup failed','Fallo al iniciar','bad')+'<p>'+t('Synthetic failure. No recovery operation runs in this preview.','Fallo ficticio. Esta vista no ejecuta ninguna recuperación.')+'</p>')}
function helper(){return head('Build a recipe from a sample, then copy it to your installation.','Crea una receta con una muestra y cópiala a tu instalación.')+
note('This standalone helper never connects to an installation. Paste or upload a sample; installed fetch and Save source are separate.','Este asistente independiente nunca se conecta a una instalación. Pega o carga una muestra; obtener datos y guardar fuentes son acciones de la aplicación instalada.')+
'<ol class="steps"><li>1 '+t('Sample','Muestra')+'</li><li aria-current="step">2 '+t('Choose fields','Elegir campos')+'</li><li>3 '+t('Test and copy','Probar y copiar')+'</li></ol>'+cols(
sec('Sample and field mapping','Muestra y asignación de campos','<label for="sample">'+t('Sample text (synthetic)','Texto de muestra (ficticio)')+'</label><textarea id="sample" rows="4" oninput="draft.sample=this.value;dirty=true">'+esc(draft.sample??'[{"name":"Northlight","id":"DEMO_ID_NOT_PLAYABLE"}]')+'</textarea><div class="fieldgrid">'+field('name-field','Channel name field','Campo del nombre','name','Keep original names.','Conserva los nombres originales.')+field('id-field','Stream ID field','Campo del ID','id','Pair fields in the same record.','Vincula campos del mismo registro.')+'</div><div class="actions">'+btn('Test recipe','Probar receta','demo()','primary')+btn('Copy recipe','Copiar receta')+'</div>')+
sec('Paired preview','Vista previa de pares',row('Northlight','DEMO_ID_NOT_PLAYABLE',badge('1 sample record','1 registro de muestra')))+
details('Manual fields, JSON and regular expressions','Campos manuales, JSON y expresiones regulares','<p>'+t('Large samples keep raw and manual workflows. The browser rendering budget is smaller than the supported source size.','Las muestras grandes conservan los modos de texto y campos manuales. El límite de visualización es menor que el tamaño de fuente admitido.')+'</p>'),
'<h2>'+t('Before using this recipe','Antes de usar la receta')+'</h2><p>'+t('A successful preview is not an import or signal check. Test in the installation before saving to a source.','Una vista previa correcta no es una importación ni una comprobación de señal. Prueba en la instalación antes de guardar en una fuente.')+'</p><hr><h3>'+t('Preview too large?','¿Vista previa demasiado grande?')+'</h3><p>'+t('Use a smaller sample or manual fields. Keep the original input available.','Usa una muestra más pequeña o campos manuales. Conserva el texto original.')+'</p>')}
const screens={recordings,guide,access,sources,connections,system,setup,recovery,helper};
const emptyText={recordings:['No saved programmes yet','Aún no hay programas guardados','Schedule a programme from its Live TV guide.','Programa una grabación desde la guía de TV en directo.'],guide:['Add your first guide','Añade tu primera guía','You can still watch without programme information.','Puedes ver canales sin información de programas.'],access:['Accounts are not enabled','Las cuentas no están activadas','Create the first administrator here. Existing access policy still applies.','Crea aquí el primer administrador. Sigue vigente la política de acceso actual.'],sources:['No channel sources yet','Aún no hay fuentes','Add a source. Saving it does not verify signal.','Añade una fuente. Guardarla no comprueba su señal.'],connections:['No TV found','No se ha encontrado ninguna TV','Check the home network or add a device manually. Supported home access needs no pairing code.','Comprueba la red doméstica o añade un dispositivo. El acceso doméstico admitido no requiere código de emparejamiento.'],system:['No job history yet','Aún no hay historial','A first run will create history. This is not an error.','La primera ejecución creará historial. No es un error.'],setup:['Start with a source','Empieza por una fuente','Skip the optional guide and return later if you wish.','Puedes omitir la guía opcional y volver después.'],recovery:['Waiting for startup status','Esperando el estado de inicio','No status is available yet. Do not assume the database is empty.','Aún no hay estado disponible. No se debe asumir que la base de datos esté vacía.'],helper:['Add a sample to begin','Añade una muestra para empezar','Use synthetic or non-sensitive data.','Usa datos ficticios o sin información sensible.']};
function content(){if(['empty','loading','permission'].includes(state)){let c=emptyText[view];return head('','')+'<section class="empty" '+(state==='loading'?'aria-busy="true"':'')+'><div class="emptyglyph" aria-hidden="true">'+(state==='loading'?'…':state==='permission'?'⊘':'+')+'</div><h2>'+(state==='empty'?t(c[0],c[1]):state==='loading'?t('Loading…','Cargando…'):t('You do not have permission','No tienes permiso'))+'</h2><p>'+(state==='empty'?t(c[2],c[3]):state==='loading'?t('Keep your place while this section loads.','Conserva tu lugar mientras se carga esta sección.'):t('Ask an administrator to review your permissions. Retrying cannot grant access.','Pide a un administrador que revise tus permisos. Reintentar no concede acceso.'))+'</p>'+(state==='loading'?'<div class="skeleton"></div>':btn(state==='permission'?'Back to viewing':'Continue',state==='permission'?'Volver a ver TV':'Continuar',state==='permission'?'demo()':"setState('ready')",'primary'))+'</section>'}
let message=state==='error'?note(view==='sources'?'Source saved, but the update failed. Retry the update; do not add the source again.':'This section could not be loaded. Previous data and unsaved changes are kept.',view==='sources'?'Fuente guardada, pero falló la actualización. Reinténtala; no vuelvas a añadir la fuente.':'No se ha podido cargar esta sección. Se conservan los datos anteriores y cambios sin guardar.','error')+btn('Retry this section','Reintentar esta sección',"setState('ready')"):state==='conflict'?note(view==='guide'?'The guide changed after this preview. Nothing was applied. Refresh and select again.':'This item changed elsewhere. Nothing was overwritten. Review the latest saved version.',view==='guide'?'La guía cambió después de la vista previa. No se aplicó nada. Actualiza y vuelve a seleccionar.':'Este elemento cambió en otra sesión. No se sobrescribió nada. Revisa la última versión guardada.','warning')+btn('Review latest version','Revisar última versión',"selected.clear();setState('ready')"):state==='unsaved'?note('Unsaved changes. Language and theme changes keep this draft. Leaving asks before discarding it.','Cambios sin guardar. Cambiar idioma o tema conserva este borrador. Al salir se pregunta antes de descartarlo.'):'';
return message+screens[view]()}
function sidebar(){let groups=[['Watch','Ver',[['TV dashboard','Inicio',''],['Live TV','TV en directo',''],['Recordings','Grabaciones','recordings'],['Events','Eventos','']]],['Manage','Gestionar',[['TV channels','Canales de TV',''],['Programme guide','Guía de programación','guide'],['Channel sources','Fuentes de canales','sources'],['Streams','Emisiones',''],['Find streams','Buscar emisiones',''],['Playlists','Listas de reproducción','']]],['Connections','Conexiones',[['Players and TVs','Reproductores y TV','connections']]],['System','Sistema',[['System status','Estado del sistema','system'],['Settings','Ajustes','access'],['WARP','WARP',''],['Changelog','Novedades','']]]];
return '<aside class="sidebar '+(menu?'open':'')+'" aria-label="'+t('Main navigation','Navegación principal')+'"><a class="brand" href="index.html"><span class="brandmark" aria-hidden="true">A</span><span>AceStream<br>Scraper</span></a><nav>'+groups.map(g=>'<div class="navgroup"><p>'+t(g[0],g[1])+'</p>'+g[2].map(x=>'<button '+(view===x[2]?'aria-current="page"':'')+' onclick="'+(x[2]?"go('"+x[2]+"')":"demo()")+'">'+t(x[0],x[1])+'</button>').join('')+'</div>').join('')+'</nav><div class="navfoot">'+t('Design preview · 03<br>All data is synthetic','Vista de diseño · 03<br>Todos los datos son ficticios')+'</div></aside>'}
function selectOptions(obj,current){return Object.entries(obj).map(([k,v])=>'<option value="'+k+'" '+(current===k?'selected':'')+'>'+t(...v)+'</option>').join('')}
function toolbar(){return '<div class="reviewbar"><a href="index.html">← '+t('Review gallery','Galería de revisión')+'</a><strong>'+t('PROPOSAL · SYNTHETIC DATA','PROPUESTA · DATOS FICTICIOS')+'</strong><span>'+t('No server connection','Sin conexión al servidor')+'</span></div><div class="reviewtools"><label>'+t('Screen','Pantalla')+'<select id="view-select" onchange="go(this.value)">'+selectOptions(views,view)+'</select></label><label>'+t('State','Estado')+'<select id="state-select" onchange="setState(this.value)">'+selectOptions(Object.fromEntries(applicable[view].map(k=>[k,states[k]])),state)+'</select></label><label>'+t('Direction','Dirección')+'<select id="direction-select" onchange="direction=this.value;render()">'+selectOptions({calm:['Calm / practical','Serena / práctica'],broadcast:['Expressive / TV','Expresiva / TV']},direction)+'</select></label><label>'+t('Accent','Acento')+'<select id="palette-select" onchange="palette=this.value;render()">'+selectOptions({coral:['Coral','Coral'],lime:['Lime','Lima']},palette)+'</select></label><button id="lang" class="button" onclick="switchLanguage()">'+t('Español','English')+'</button><button id="theme" class="button" onclick="switchTheme()">'+t(theme==='dark'?'Light theme':'Dark theme',theme==='dark'?'Tema claro':'Tema oscuro')+'</button></div>'}
function switchLanguage(){lang=lang==='en'?'es':'en';render()}
function switchTheme(){theme=theme==='dark'?'light':'dark';render()}
function render(){let active=document.activeElement?.id;document.documentElement.lang=lang;document.body.className=theme+' '+palette+' '+direction+(q.get('presentation')==='1'?' presentation':'');document.querySelector('.skip').textContent=t('Skip to content','Saltar al contenido');document.title=t(...views[view])+' · '+t('Design preview','Vista de diseño');document.getElementById('app').innerHTML=toolbar()+'<header class="mobilehead"><button class="button" onclick="menu=!menu;render()" aria-expanded="'+menu+'">'+t('Menu','Menú')+'</button><strong>AceStream Scraper</strong></header><div class="layout '+(view==='helper'?'standalone':'')+'">'+(view==='helper'?'':sidebar())+'<main id="main" tabindex="-1">'+content()+'<footer class="pagefooter">'+t('Review proposal. No real actions. Palette, typography and navigation are not approved.','Propuesta de revisión. Sin acciones reales. La paleta, tipografía y navegación no están aprobadas.')+'</footer></main></div>';if(active)document.getElementById(active)?.focus();if(state==='destructive')openConfirm()}
function setState(s){state=s;dirty=s==='unsaved';if(s==='conflict')selected.clear();render()}
function go(v){if(dirty||state==='unsaved'){document.getElementById('view-select').value=view;openConfirm('leave',()=>{cancelDraft();view=v;menu=false;render();document.getElementById('title')?.focus()});return}view=v;state='ready';menu=false;render();document.getElementById('title')?.focus();scrollTo(0,0)}
function updateDirty(){document.querySelectorAll('.savebar button').forEach(e=>e.disabled=false);document.querySelectorAll('.savebar>span').forEach(e=>e.textContent=t('Unsaved changes','Cambios sin guardar'))}
function announce(s){document.getElementById('feedback').textContent=s}
function demo(){announce(t('Illustrative action only. No server, media or account operation was performed.','Acción ilustrativa. No se ha realizado ninguna operación en el servidor, medios ni cuentas.'))}
function saveDraft(){dirty=false;state='ready';render();announce(t('Saved in this preview only.','Guardado solo en esta vista previa.'))}
function cancelDraft(){Object.assign(draft,{source:'Family channels',url:'https://example.invalid/channels.m3u',cast:true,remote:false});dirty=false;state='ready';render()}
function sourceResult(importing){dirty=false;announce(importing?t('Preview: source saved. Update waiting in the queue; no streams imported yet.','Vista previa: fuente guardada. Actualización en cola; aún no se importó ninguna emisión.'):t('Preview: source saved. No update or import was requested.','Vista previa: fuente guardada. No se solicitó actualizar ni importar.'))}
function selectionText(){return t(selected.size+' selected · nothing applied',selected.size+' seleccionadas · sin aplicar')}
function selectMatch(i,on){on?selected.add(i):selected.delete(i);document.getElementById('apply-matches').disabled=!selected.size;document.getElementById('selection-count').textContent=selectionText()}
function applyMatches(){announce(selected.size?t('Preview: selected matches would be rechecked before applying.','Vista previa: se volverían a comprobar las coincidencias seleccionadas antes de aplicar.'):t('Select at least one reviewed match first.','Selecciona primero al menos una coincidencia revisada.'))}
function showRecordingSettings(){announce(t('Canonical editor proposal: Settings → Recordings, shared with this page. See the field ledger for enablement, storage limits and retention; no account editor is substituted.','Editor canónico propuesto: Ajustes → Grabaciones, compartido con esta página. Consulta activación, límites y conservación en el inventario de campos; no se sustituye por el editor de cuentas.'))}
function openConfirm(kind='',after){let dialog=document.getElementById('confirm'),opener=document.activeElement,title,body,action;
if(kind==='leave'){title=t('Discard unsaved changes?','¿Descartar cambios sin guardar?');body=t('Only this draft will be discarded. Saved settings stay unchanged.','Solo se descarta este borrador. Los ajustes guardados no cambian.');action=t('Discard and leave','Descartar y salir')}
else if(view==='access'){title=t('Save these permissions?','¿Guardar estos permisos?');body=t('viewer-demo will be signed out and its API credentials revoked. They will need to sign in again.','Se cerrarán las sesiones de viewer-demo y se revocarán sus credenciales de API. Tendrá que iniciar sesión de nuevo.');action=t('Save permissions','Guardar permisos')}
else if(view==='sources'){title=t('Remove this source?','¿Eliminar esta fuente?');body=t('Example: Family channels owns 8 streams, including 3 linked to TV channels. Removing those streams may leave channels without a playable source. TV channels themselves are kept.','Ejemplo: Family channels tiene 8 emisiones, 3 vinculadas a canales de TV. Eliminarlas puede dejar canales sin emisión reproducible. Los canales de TV se conservan.');action=t('Remove source','Eliminar fuente')}
else if(view==='recovery'){title=kind==='fresh'?t('Back up and start empty?','¿Crear copia y empezar vacío?'):t('Back up and recover readable data?','¿Crear copia y recuperar datos legibles?');body=kind==='fresh'?t('Back up database and migration files first. Replace the catalogue with an empty database. Reconfigure sources, channels, catalogue settings and integrations. Account storage remains separate.','Primero se copian la base de datos y los archivos de migración. El catálogo se sustituye por uno vacío. Reconfigura fuentes, canales, ajustes del catálogo e integraciones. Las cuentas se mantienen por separado.'):t('Back up first. Recover sources and readable data. Damaged rows may be skipped; programme listings and activity history are not copied.','Primero se crea una copia. Se recuperan fuentes y datos legibles. Pueden omitirse filas dañadas; no se copian programas ni historial de actividad.');action=kind==='fresh'?t('Back up and start fresh','Crear copia y empezar de cero'):t('Back up and recover','Crear copia y recuperar')}
else if(view==='recordings'&&recordTab==='upcoming'){title=t('Cancel this schedule?','¿Cancelar esta programación?');body=t('The evening interview will not be recorded. Other schedules and saved files stay unchanged.','The evening interview no se grabará. Las demás programaciones y archivos guardados no cambian.');action=t('Cancel schedule','Cancelar programación')}
else {title=t('Delete recording files?','¿Eliminar archivos de la grabación?');body=t('Delete every saved part of Coastlines: the Atlantic. This cannot be undone. Protected, active or in-use files must be rejected by the server.','Elimina todas las partes guardadas de Coastlines: the Atlantic. No se puede deshacer. El servidor debe impedirlo si están protegidas, activas o en uso.');action=t('Delete files','Eliminar archivos')}
dialog.innerHTML='<div class="dialogbody"><div class="eyebrow">'+t('ILLUSTRATIVE CONFIRMATION','CONFIRMACIÓN ILUSTRATIVA')+'</div><h2 id="dialog-title">'+title+'</h2><p>'+body+'</p>'+(view==='sources'&&kind!=='leave'?'<label class="check"><input type="checkbox" checked>'+t('Also delete the 8 source-owned streams','Eliminar también las 8 emisiones de esta fuente')+'</label>':'')+'<div class="actions"><button class="button" id="dialog-cancel">'+t('Go back','Volver')+'</button><button class="button danger" id="dialog-commit">'+action+'</button></div><p class="caption">'+t('Design preview: no real data changes.','Vista de diseño: no cambia datos reales.')+'</p></div>';
const close=()=>{dialog.close();opener?.focus()};document.getElementById('dialog-cancel').onclick=close;document.getElementById('dialog-commit').onclick=()=>{close();if(after)after();else demo()};dialog.oncancel=()=>setTimeout(()=>opener?.focus(),0);if(!dialog.open)dialog.showModal();document.getElementById('dialog-cancel').focus()}
render();
</script></body></html>
