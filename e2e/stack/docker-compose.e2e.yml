# Live services for the e2e suite. The scraper app itself normally runs from
# source on the host (stack/backend-start.sh) so it can be debugged; the
# containerised copy is published on :8001 for `npm run test:docker`.
name: acestream-e2e

services:
  engine:
    image: ${E2E_IMAGE:-acestream-scraper:e2e-arm64}
    platform: ${E2E_PLATFORM:-linux/arm64}
    container_name: acestream-e2e-engine
    # WARP needs a TUN device and NET_ADMIN/SYS_ADMIN; opt in with E2E_ENABLE_WARP=true.
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      ENABLE_ACESTREAM_ENGINE: "true"
      ENABLE_ACEXY: "true"
      ENABLE_WARP: "${E2E_ENABLE_WARP:-false}"
      WARP_ENABLE_NAT: "${E2E_ENABLE_WARP:-false}"
      ENABLE_IPFS: "true"
      DATABASE_URL: sqlite:///./config/scraper.db
      LEGACY_DATABASE_URL: sqlite:///./config/acestream.db
      ALLOW_PRIVATE_SCRAPE_TARGETS: "true"
      # This container exercises embedded Kubo; app-off below exercises the external sidecar.
    ports:
      - "127.0.0.1:6878:6878"   # AceStream engine HTTP API
      - "127.0.0.1:8081:8080"   # Acexy proxy (/ace/getstream, /ace/status)
      - "127.0.0.1:8001:8000"   # containerised scraper app (docker target)
      - "8621:8621"             # engine P2P
      - "8621:8621/udp"
    volumes:
      - ../.stack/container-config:/app/config
      - acestream-state:/var/lib/acestream
      - ipfs-data-embedded:/data/ipfs
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # The same image with every optional service switched off: the app must still work
  # against an engine that lives elsewhere (here: the `engine` container over the compose network).
  app-off:
    image: ${E2E_IMAGE:-acestream-scraper:e2e-arm64}
    platform: ${E2E_PLATFORM:-linux/arm64}
    container_name: acestream-e2e-app-off
    environment:
      ENABLE_ACESTREAM_ENGINE: "false"
      ENABLE_ACEXY: "false"
      ENABLE_WARP: "false"
      ACE_ENGINE_URL: "http://engine:6878"
      DATABASE_URL: sqlite:///./config/scraper.db
      LEGACY_DATABASE_URL: sqlite:///./config/acestream.db
      ALLOW_PRIVATE_SCRAPE_TARGETS: "true"
      IPFS_GATEWAY_URL: "http://ipfs:8080"
    ports:
      - "127.0.0.1:8002:8000"   # services-off flavour (npm run test:docker-off)
    volumes:
      - ../.stack/container-off-config:/app/config
    depends_on:
      - engine

  ipfs:
    image: ipfs/kubo:latest
    container_name: acestream-e2e-ipfs
    ports:
      - "127.0.0.1:8080:8080"   # gateway: http://127.0.0.1:8080/ipns/<key>/
    volumes:
      - ipfs-data:/data/ipfs

volumes:
  acestream-state: {}
  ipfs-data: {}
  ipfs-data-embedded: {}
